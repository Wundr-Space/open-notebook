# azure-pipelines.yml
# Azure DevOps Pipeline for deploying Open Notebook with Ollama

trigger:
  branches:
    include:
      - main
      - develop

variables:
  # Deployment configuration
  DEPLOYMENT_PATH: '/opt/open-notebook'
  COMPOSE_PROJECT_NAME: 'open-notebook'

  # Azure VM/Host connection
  # Configure this in Azure DevOps: Project Settings > Service Connections > SSH
  SSH_SERVICE_CONNECTION: 'YourSSHServiceConnection'

stages:
  - stage: Build
    displayName: 'Build and Push Images'
    jobs:
      - job: BuildImages
        displayName: 'Build Docker Images'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # NOTE: This build does NOT include Ollama models
          # Models are downloaded on the deployment server (see Deploy stage)
          # This keeps build artifacts small (~2GB vs ~10GB with models)
          - task: Docker@2
            displayName: 'Build and verify images (models excluded)'
            inputs:
              command: 'build'
              Dockerfile: '**/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest

  - stage: Deploy
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy to Production Server'
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                # 1. Copy files to remote server
                - task: CopyFilesOverSSH@0
                  displayName: 'Copy deployment files'
                  inputs:
                    sshEndpoint: $(SSH_SERVICE_CONNECTION)
                    sourceFolder: '$(Build.SourcesDirectory)'
                    contents: |
                      docker-compose.full.yml
                      docker-compose.prod.yml
                      docker.env
                      scripts/**
                    targetFolder: $(DEPLOYMENT_PATH)
                    cleanTargetFolder: false
                    overwrite: true

                # 2. Deploy containers
                - task: SSH@0
                  displayName: 'Deploy Docker Compose Stack'
                  inputs:
                    sshEndpoint: $(SSH_SERVICE_CONNECTION)
                    runOptions: 'inline'
                    inline: |
                      set -e
                      cd $(DEPLOYMENT_PATH)

                      echo "Pulling latest images..."
                      docker compose -f docker-compose.full.yml -f docker-compose.prod.yml pull

                      echo "Starting services..."
                      docker compose -f docker-compose.full.yml -f docker-compose.prod.yml up -d

                      echo "Waiting for services to be healthy..."
                      timeout=120
                      elapsed=0
                      while [ $elapsed -lt $timeout ]; do
                        if docker compose -f docker-compose.full.yml -f docker-compose.prod.yml ps | grep -q "healthy"; then
                          echo "Services are healthy!"
                          break
                        fi
                        echo "Waiting for health checks... ($elapsed/$timeout seconds)"
                        sleep 5
                        elapsed=$((elapsed + 5))
                      done

                # 3. Initialize Ollama models on deployment server
                # Models are downloaded HERE (not during build) to keep artifacts small
                # This only downloads on FIRST deployment - persistent volumes reuse models
                - task: SSH@0
                  displayName: 'Download Ollama Models (First Run Only)'
                  inputs:
                    sshEndpoint: $(SSH_SERVICE_CONNECTION)
                    runOptions: 'inline'
                    inline: |
                      set -e
                      cd $(DEPLOYMENT_PATH)

                      echo "Checking Ollama models on deployment server..."

                      # Function to check and pull model
                      ensure_model() {
                        local model=$1
                        echo "Checking for model: $model"
                        if docker compose -f docker-compose.full.yml -f docker-compose.prod.yml exec -T ollama ollama list | grep -q "$model"; then
                          echo "✓ Model $model already exists (using cached version)"
                        else
                          echo "⬇ Downloading model: $model (first deployment only, ~2-5 minutes)..."
                          docker compose -f docker-compose.full.yml -f docker-compose.prod.yml exec -T ollama ollama pull "$model"
                          echo "✓ Model $model downloaded and cached in persistent volume"
                        fi
                      }

                      # Download required models (only if missing)
                      ensure_model "nomic-embed-text"
                      ensure_model "qwen2.5:3b"

                      echo "All Ollama models are ready! Future deployments will skip this step."

                # 4. Verify deployment
                - task: SSH@0
                  displayName: 'Verify Deployment'
                  inputs:
                    sshEndpoint: $(SSH_SERVICE_CONNECTION)
                    runOptions: 'inline'
                    inline: |
                      set -e
                      cd $(DEPLOYMENT_PATH)

                      echo "Verifying deployment..."

                      # Check all services are running
                      docker compose -f docker-compose.full.yml -f docker-compose.prod.yml ps

                      # Test Ollama connectivity
                      echo "Testing Ollama..."
                      curl -f http://localhost:11434/api/tags || (echo "Ollama health check failed" && exit 1)

                      # Test Open Notebook API
                      echo "Testing Open Notebook API..."
                      curl -f http://localhost:5055/health || (echo "Open Notebook health check failed" && exit 1)

                      echo "✓ Deployment verified successfully!"

                # 5. Cleanup old images (optional)
                - task: SSH@0
                  displayName: 'Cleanup Old Images'
                  inputs:
                    sshEndpoint: $(SSH_SERVICE_CONNECTION)
                    runOptions: 'inline'
                    inline: |
                      echo "Cleaning up unused Docker images..."
                      docker image prune -f --filter "until=168h"  # Remove images older than 7 days
                      echo "Cleanup complete!"

  - stage: Rollback
    displayName: 'Rollback on Failure'
    dependsOn: Deploy
    condition: failed()
    jobs:
      - job: RollbackDeployment
        displayName: 'Rollback to Previous Version'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: SSH@0
            displayName: 'Rollback containers'
            inputs:
              sshEndpoint: $(SSH_SERVICE_CONNECTION)
              runOptions: 'inline'
              inline: |
                cd $(DEPLOYMENT_PATH)
                echo "Rolling back to previous version..."
                docker compose -f docker-compose.full.yml -f docker-compose.prod.yml down
                # Add your rollback logic here
                echo "Rollback complete"
