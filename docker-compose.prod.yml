# docker-compose.prod.yml
# Production overrides for docker-compose.full.yml
# Usage: docker compose -f docker-compose.full.yml -f docker-compose.prod.yml up -d

services:
  surrealdb:
    volumes:
      # Use named volume for production persistence
      - surreal_data:/mydata
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ollama:
    volumes:
      # Use named volume for production persistence
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  open_notebook:
    depends_on:
      surrealdb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5055/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Named volumes for production
# These will persist across deployments and container restarts
volumes:
  surreal_data:
    driver: local
  ollama_models:
    driver: local
  notebook_data:
    driver: local
