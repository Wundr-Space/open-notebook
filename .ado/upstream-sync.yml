schedules:
- cron: "0 6 * * *"
  displayName: "Daily upstream sync"
  branches:
    include: [ develop ]
  always: true

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  AZDO_ORG: "https://dev.azure.com/wundr"
  AZDO_PROJECT: "Communi.Team"
  TARGET_BRANCH: "develop"
  SYNC_BRANCH: "upstream-sync"
  UPSTREAM_URL: "https://github.com/lfnovo/open-notebook.git"

steps:
# 1) Ensure the pipeline has an authenticated 'origin' remote
- checkout: self
  persistCredentials: true
  clean: true
  fetchDepth: 0   # full history so origin/<branch> refs are available

# 2) Sync script
- script: |
    set -e
    git config user.name  "Wundr Sync Bot"
    git config user.email "devops@wundr.space"

    # Add & fetch upstream (public GitHub)
    git remote add upstream $(UPSTREAM_URL) || true
    git fetch upstream

    # Make sure we have all refs from origin (ADO) with credentials
    git fetch origin --prune

    # Prepare/refresh the local sync branch
    if git ls-remote --exit-code origin refs/heads/$(SYNC_BRANCH) >/dev/null 2>&1; then
      git checkout -B $(SYNC_BRANCH) origin/$(SYNC_BRANCH)
      git pull origin $(SYNC_BRANCH)
    else
      # Start from target branch (develop) which is protected in origin
      if git ls-remote --exit-code origin refs/heads/$(TARGET_BRANCH) >/dev/null 2>&1; then
        git checkout -B $(SYNC_BRANCH) origin/$(TARGET_BRANCH)
      else
        echo "ERROR: origin/$(TARGET_BRANCH) not found. Check TARGET_BRANCH variable."
        exit 1
      fi
    fi

    # Mirror upstream/main exactly into the sync branch
    git reset --hard upstream/main

    # Detect changes vs remote sync branch
    CHANGED="no"
    if ! git diff --quiet HEAD origin/$(SYNC_BRANCH) --; then
      CHANGED="yes"
      echo "Pushing $(SYNC_BRANCH) to origin…"
      git push origin $(SYNC_BRANCH) --force
    else
      echo "No upstream changes detected."
    fi

    echo "##vso[task.setvariable variable=CHANGED]$CHANGED"
  displayName: "Sync branch to upstream/main"

# 3) Create PR if changes
- task: Bash@3
  displayName: "Create PR (if changes detected)"
  condition: eq(variables['CHANGED'], 'yes')
  inputs:
    targetType: inline
    script: |
      set -e
      # Use pipeline token for az devops
      az devops configure --defaults organization=$(AZDO_ORG) project=$(AZDO_PROJECT)
      echo $(System.AccessToken) | az devops login --organization $(AZDO_ORG)

      # Avoid duplicate active PRs
      EXISTING=$(az repos pr list \
        --source-branch $(SYNC_BRANCH) \
        --target-branch $(TARGET_BRANCH) \
        --status active \
        --query "length(@)")
      if [ "$EXISTING" != "0" ]; then
        echo "Active PR already exists; skipping."
        exit 0
      fi

      TITLE="Upstream sync: $(date -u +%Y-%m-%d) – mirror of upstream/main"
      BODY=$'Daily mirror of upstream.\n\nPlease review, run tests, and merge if green.'

      az repos pr create \
        --source-branch $(SYNC_BRANCH) \
        --target-branch $(TARGET_BRANCH) \
        --title "$TITLE" \
        --description "$BODY" \
        --auto-complete false
